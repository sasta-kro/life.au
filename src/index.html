<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf7f0">
  <meta name="description" content="Life.AU is under construction. Explore live projects and see what is coming next.">
  <title>Under construction | Life.AU</title>
  <link rel="stylesheet" href="styles.css">
  <script src="motion.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#projects">Skip to projects</a>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy container">
        <p class="eyebrow">Assumption University</p>
        <h1 id="page-title">Under construction<span class="full-stop">.</span></h1>
        <p class="intro">This space is taking shape.<br class="mobile-break"> A few projects are already live.</p>
      </div>
      <div class="scene-frame">
        <!-- CONSTRUCTION_SCENE -->
      </div>
      <div class="scene-caption container">
        <span class="site-address">life.au.edu</span>
        <button class="motion-toggle" type="button" aria-pressed="false" aria-label="Pause construction animation" hidden>
          <span class="motion-indicator" aria-hidden="true"></span><span data-motion-label>Pause animation</span>
        </button>
      </div>
    </section>
    <section class="projects container" id="projects" aria-labelledby="projects-title" tabindex="-1">
      <div class="section-heading"><h2 id="projects-title">Projects</h2><p>Open now. More on the way.</p></div>
      <ul class="project-grid">
        <!-- PROJECTS -->
      </ul>
    </section>
  </main>
  <footer class="footer container">
    <span>Assumption University</span>
    <span>Developed by <span class="developer">Sai Aike Shwe Tun Aung</span></span>
  </footer>
</body>
</html>
